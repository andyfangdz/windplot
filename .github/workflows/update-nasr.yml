name: Update NASR Data

on:
  schedule:
    # Run daily at 6:00 AM UTC so a failed update can recover the next day.
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-nasr:
    runs-on: ubuntu-latest
    # Hard cap includes Retry-After waits, downloads, install and generation.
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download, parse, and index NASR data
        run: npm run update-nasr

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/lib/airports-data.json src/lib/spatial-index.bin; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/lib/airports-data.json src/lib/spatial-index.bin
          git commit -m "chore: update NASR airport data [automated]"
          git push
